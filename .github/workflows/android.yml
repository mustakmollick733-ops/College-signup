name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project

          if [ -d "project/SimCityWarBot_cloud" ]; then
            mv project/SimCityWarBot_cloud/* project/
            mv project/SimCityWarBot_cloud/.[!.]* project/ 2>/dev/null || true
            rmdir project/SimCityWarBot_cloud
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimCityWarBot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
